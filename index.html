<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Deal or No Deal - Deluxe</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background-color: #111; color: white; margin: 0; padding: 10px; text-align: center; }
  button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #d4af37; border: none; font-weight: bold; border-radius: 5px; }
  button:hover { background: #f1c40f; }
  
  /* Player Name Screen */
  #player-screen { max-width: 450px; width: 100%; margin: 40px auto; background: #222; padding: 25px; border-radius: 10px; border: 2px solid #d4af37; text-align: left; }
  #player-screen h1 { color: #ffd700; margin-bottom: 5px; text-align: center; }
  #player-input { width: 100%; padding: 10px; font-size: 16px; background: #333; border: 1px solid #666; color: white; border-radius: 5px; text-align: center; margin: 10px 0; }
  
  .media-upload-group { margin-bottom: 10px; background: #333; padding: 8px; border-radius: 5px; }
  .media-upload-group label { display: block; font-size: 0.85em; margin-bottom: 3px; color: #f1c40f; }
  .media-upload-group input[type="file"] { width: 100%; color: #ccc; font-size: 0.8em; }

  /* Setup Screen & Inputs */
  #setup-screen { max-width: 600px; width: 100%; margin: auto; background: #222; padding: 15px; border-radius: 10px; display: none; }
  .setup-help { color: #aaa; margin-bottom: 15px; font-size: 0.9em; }
  .setup-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; background: #333; padding: 8px; border-radius: 5px; flex-wrap: wrap; }
  .setup-row span { font-weight: bold; min-width: 25px; }
  .setup-row input[type="text"] { flex: 1; min-width: 140px; padding: 8px; background: #444; border: 1px solid #666; color: white; border-radius: 4px; font-size: 14px; }
  
  .val-container { display: flex; align-items: center; gap: 5px; background: #222; padding: 4px 8px; border-radius: 5px; border: 1px solid #444; color: gold; font-weight: bold; font-size: 1em; }
  .num-input { width: 65px; padding: 6px; background: #444; border: 1px solid #666; color: gold; border-radius: 4px; font-weight: bold; font-size: 14px; text-align: center; }
  .num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num-input[type=number] { -moz-appearance: textfield; }

  /* Game Screen */
  #game-screen { display: none; flex-direction: column; min-height: 95vh; width: 100%; max-width: 1400px; margin: auto; }
  #top-bar { padding: 10px; background: #333; font-size: 1.1em; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-radius: 5px; margin-bottom: 10px; }
  #instruction-text { color: #f1c40f; font-size: 0.95em; }
  
  /* Golden Podium */
  #golden-area { display: flex; flex-direction: column; align-items: center; margin: 5px 0 10px 0; }
  #golden-podium { width: 110px; height: 80px; border: 3px solid gold; border-radius: 8px; background: rgba(255, 215, 0, 0.1); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255,215,0,0.4); }
  
  #main-area { display: flex; flex: 1; gap: 10px; justify-content: center; align-items: flex-start; }
  
  /* Prize Boards */
  .prize-board { width: 22%; display: flex; flex-direction: column; gap: 4px; }
  .prize-item { background: #d4af37; color: black; padding: 4px 6px; font-weight: bold; border-radius: 3px; font-size: 0.75em; display: flex; justify-content: space-between; }
  .prize-eliminated { background: #444; color: #777; text-decoration: line-through; }
  
  /* Briefcases */
  #cases-area { width: 52%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-content: start; justify-items: center; }
  .briefcase { width: 100%; aspect-ratio: 4 / 3; max-width: 75px; background: #8b9dc3; border: 2px solid #3b5998; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: black; cursor: pointer; transition: transform 0.2s; box-shadow: 2px 2px 4px rgba(0,0,0,0.5); background-image: linear-gradient(to bottom, #a2b2d4, #7388b5); }
  .briefcase:hover { transform: scale(1.08); }
  .briefcase.opened { visibility: hidden; }
  .briefcase.keeper { margin: 0; transform: scale(1.15); cursor: default; width: 85px; height: 60px; }
  .briefcase.keeper:hover { transform: scale(1.15); }

  /* Full Screen Animation Overlay */
  #fs-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; perspective: 1200px; padding: 20px; transition: background-color 0.5s ease; }
  .fs-title { color: white; font-size: 2em; margin-bottom: 25px; font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
  
  .fs-case-container { width: 320px; height: 220px; position: relative; transition: transform 0.3s; }
  
  .shake { animation: suspenseShake 0.4s infinite alternate; }
  @keyframes suspenseShake {
    0% { transform: translateX(-8px) rotate(-2deg); }
    100% { transform: translateX(8px) rotate(2deg); }
  }

  .flash-happy { background: rgba(39, 174, 96, 0.85) !important; }
  .flash-sad { background: rgba(192, 57, 43, 0.85) !important; }

  .fs-case-body { position: absolute; width: 100%; height: 100%; background: #48639c; border: 6px solid #203154; border-radius: 12px; box-shadow: inset 0 -40px rgba(0,0,0,0.4), 0 10px 25px rgba(0,0,0,0.8); z-index: 1; }
  .fs-lid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #5d7cb8; border: 6px solid #203154; border-radius: 12px; transform-origin: top; transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1); z-index: 3; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
  
  .open-anim .fs-lid { transform: rotateX(120deg); }
  
  .fs-prize-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%) scale(0.2); width: 140%; text-align: center; color: #ffd700; font-size: 2.5em; font-weight: bold; text-shadow: 3px 3px 8px #000; opacity: 0; z-index: 4; transition: all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s; }
  .open-anim .fs-prize-text { transform: translate(-50%, -140%) scale(1); opacity: 1; }

  #fs-timer { margin-top: 35px; color: #aaa; font-size: 1.2em; font-weight: bold; letter-spacing: 1px; }

  /* Fancy Last Chance Reveal Overlay */
  #last-chance-reveal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; }
  .vault-box { width: 350px; height: 250px; background: radial-gradient(circle, #d4af37, #8b6508); border: 8px solid #fff; border-radius: 15px; display: flex; align-items: center; justifyContent: center; box-shadow: 0 0 50px gold; font-size: 2em; font-weight: bold; color: black; text-align: center; padding: 20px; animation: pulseVault 1.5s infinite alternate; }
  @keyframes pulseVault { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

  /* Video Ad Overlay */
  #ad-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2500; display: none; align-items: center; justify-content: center; }
  #ad-video { width: 100%; height: 100%; object-fit: contain; }

  /* Modal */
  #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; padding: 15px; }
  #modal-content { background: #222; padding: 30px 20px; border: 2px solid #d4af37; border-radius: 10px; max-width: 450px; width: 100%; text-align: center; }
  .modal-buttons { margin-top: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
  .deal-btn { background: #27ae60; color: white; }
  .nodeal-btn { background: #c0392b; color: white; }
